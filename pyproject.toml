[project]
name = "lantai"
version = "0.69.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.163.1,<0.164",
  "uvicorn[standard]>=0.54,<0.55",
  "SQLAlchemy>=2.1.9,<2.2",
  # SQLModel UTCDateTime: aware UTC writes/queries and timezone-aware reads.
  # Legacy SQLite values already represent UTC; real-copy replay verifies compatibility.
  "sqlmodel>=0.0.50,<0.0.51",
  "pydantic>=2.14.3,<3",
  "pydantic-settings>=2.16.3,<3",
  "httpx>=0.27",
  "feedparser>=6.0",
  "apscheduler>=3.11.3,<4",  # 调度循环和线程活性契约针对 APScheduler 3.x
  "python-ulid>=4.1,<5",
  "numpy>=2.4.6,<3",
  "scikit-learn>=1.9.1,<2",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "openai>=3.52,<4",
  "tenacity>=8.5",
  # Rust-backed embedded Chroma; old collections migrate via verified export/import.
  # Exact resolved builds are pinned in uv.lock and the container consumes that lock.
  "chromadb>=1.5.9,<2.0",
  "requests>=2.31",
  "jieba>=0.42",
  "psutil>=7.2.2",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.16.0,<0.17.0",
]
vision = []
obsidian = ["watchdog>=4"]
wiki = ["markdown>=3.6"]
all = ["lantai[vision,obsidian,wiki]"]

[project.scripts]
lantai-mcp = "lantai.cli.mcp:main"
lantai-mcp-bridge = "lantai.cli.mcp_bridge:main"
lantai-server = "lantai.api.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["lantai*"]

[tool.setuptools.package-data]
"lantai.api" = ["ui/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
# 门禁范围纪律：lint/format 只管产品代码与测试（lantai/ tests/ scripts/）。
# 调研工作区（docs/research/ 下的一次性图表/看板生成脚本）与草稿区（.scratch/）是
# 交付物一次性资产，不入 CI 门禁——否则 CI 测试门禁会被它们的存量违规永久挡住
# （v0.22.1 前实测：73 条既有违规让 ruff check . 长期失败，pytest 从未在 CI 跑过）。
# 若要把它们纳入，须先清理存量并单独成一票，不混入门禁收口。
extend-exclude = [
    "docs/research",
    ".scratch",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E712", "E501", "E741", "SIM117", "B017", "E702", "E402", "B905", "B904", "SIM102", "N806", "N818", "B007", "N817", "N999", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "Depends"]
