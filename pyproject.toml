[project]
name = "remembrance-system"
version = "0.3.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "feedparser>=6.0",
  "apscheduler>=3.10",
  "python-ulid>=2.7",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "rank-bm25>=0.2.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "openai>=1.40",
  "tenacity>=8.5",
  "chromadb>=0.4",
  "jieba>=0.42",
  "requests>=2.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["remembrance*"]
