[project]
name = "lantai"
version = "0.21.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "feedparser>=6.0",
  "apscheduler>=3.10",
  "python-ulid>=2.7",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "openai>=1.40",
  "tenacity>=8.5",
  "chromadb>=0.4,<1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
vision = []
obsidian = ["watchdog>=4"]
wiki = ["markdown>=3.6"]
all = ["lantai[vision,obsidian,wiki]"]

[project.scripts]
lantai-mcp = "scripts.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["lantai*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
