[project]
name = "lantai"
version = "0.22.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # sqlmodel 0.0.47 起 UTCDateTime.process_bind_param 对 naive datetime 直接 raise
  # （ValueError: Datetime values must have timezone information）。原无上界时
  # CI 装 0.0.47、本地装 0.0.42，同一次代码在两边一红一绿——v0.22.1 后 CI 全量
  # 测试第一次真正跑起来就红 37 例，全部源于此漂移。
  # 兰台产品链路已全部写 aware（lantai/core/time.py:utcnow 及 ensure_aware），
  # 上界 <0.0.48 挡的是「未评估的破坏性行为变更」；0.0.48+ 升级单独开票评测。
  "sqlmodel>=0.0.22,<0.0.48",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "feedparser>=6.0",
  "apscheduler>=3.10",
  "python-ulid>=2.7",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "openai>=1.40",
  "tenacity>=8.5",
  # chromadb 0.6.3 为 0.x 末版；PYSEC-2026-3813/3814/3815 的修复只在 1.x（重大重写）。
  # 缓解：兰台仅用内嵌 PersistentClient（无服务端/RBAC 面、单用户本地部署）。
  # 1.x 迁移为独立专项（见 .scratch/p0-reliability-host-loop/issues/07-advisory-audit.md）。
  "chromadb>=0.4,<1.0",
  "requests>=2.31",
  "jieba>=0.42",
  "psutil>=7.2.2",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.16.0,<0.17.0",
]
vision = []
obsidian = ["watchdog>=4"]
wiki = ["markdown>=3.6"]
all = ["lantai[vision,obsidian,wiki]"]

[project.scripts]
lantai-mcp = "lantai.cli.mcp:main"
lantai-server = "lantai.api.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["lantai*"]

[tool.ruff]
target-version = "py311"
line-length = 100
# 门禁范围纪律：lint/format 只管产品代码与测试（lantai/ tests/ scripts/）。
# 调研工作区（docs/research/ 下的一次性图表/看板生成脚本）与草稿区（.scratch/）是
# 交付物一次性资产，不入 CI 门禁——否则 CI 测试门禁会被它们的存量违规永久挡住
# （v0.22.1 前实测：73 条既有违规让 ruff check . 长期失败，pytest 从未在 CI 跑过）。
# 若要把它们纳入，须先清理存量并单独成一票，不混入门禁收口。
extend-exclude = [
    "docs/research",
    ".scratch",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E712", "E501", "E741", "SIM117", "B017", "E702", "E402", "B905", "B904", "SIM102", "N806", "N818", "B007", "N817", "N999", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "Depends"]
