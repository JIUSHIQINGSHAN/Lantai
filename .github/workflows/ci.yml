name: Build and Push Docker Image

# G1 发版闸门（票 .scratch/v0.64-next-window-2026-11/issues/10）：
# tag push 先跑测试（ruff 双门禁 + 全量 pytest），全绿才构建推送镜像——
# 「红灯出镜像」路径关闭。此前 build 是孤立 job，v0.39–v0.59 共 21 个
# 标签未经 CI 直接出镜像。needs 只在同一 workflow 内生效，tests.yml
# （master/PR 常态门禁）不能替代本闸门。coverage 与遗忘质量门禁不复制：
# 发版闸门只管「树是绿的」，常态门禁在 tests.yml。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # 供应链锁定：actions 用 commit SHA 而非可变 tag（审计 M6）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .[dev]
      # 口径与 tests.yml 完全一致（lint 范围、API_KEY 非空防 DEV MODE 回退）
      - name: Lint and Format Check (Ruff)
        run: |
          ruff check lantai/ tests/ scripts/
          ruff format --check lantai/ tests/ scripts/
      - name: Full test suite
        env:
          # shell hook 子进程测试要求非空 API_KEY(禁止 DEV MODE 回退);CI 无 .env
          API_KEY: test-key
        run: pytest tests/ -q

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      # 供应链锁定：actions 用 commit SHA 而非可变 tag（审计 M6）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # GHCR 要求 repository name 全小写，owner 必须转小写（否则 invalid tag）
      - name: Lowercase owner
        id: owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER }}/lantai:${{ steps.tag.outputs.VERSION }}
            ghcr.io/${{ steps.owner.outputs.OWNER }}/lantai:latest
          platforms: linux/amd64,linux/arm64
