name: Tests

# 测试门禁（评测集纳入 CI）：push 到 master / PR 时跑全量 pytest +
# 遗忘质量离线门禁（chinese-memory-v2，FTS 兜底最严格基准）。
# 供应链纪律同 ci.yml：actions 锁 commit SHA（非可变 tag）。

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -e .[dev]
      - name: Lint and Format Check (Ruff)
        # 门禁范围＝产品代码 + 测试（lantai/ tests/ scripts/）。
        # 历史上这里是 `ruff check .`：带着 73 条既有违规（多在 docs/research 与 .scratch
        # 的一次性调研脚本里）长期失败，导致本 job 的全量 pytest 与遗忘质量门禁
        # 从未在 CI 真正执行过（v0.22.1 前实证，Tests job 51 秒挂在 lint 步骤）。
        # 目录显式列出而非 `ruff check .`：显式传径时 exclude 配置不生效，必须靠
        # 命令本身圈定范围（docs/ 的 markdown 代码块与调研脚本均非产品代码）。
        run: |
          ruff check lantai/ tests/ scripts/
          ruff format --check lantai/ tests/ scripts/
      - name: Full test suite with coverage
        run: pytest tests/ -q --cov=lantai --cov-report=term-missing
      - name: Forgetting quality gate (chinese-memory-v2)
        env:
          # offline.py 已 patch embed，不会真调 API；假 key 仅满足 client.py 模块级 OpenAI() import
          OPENAI_API_KEY: test-key
        run: python scripts/run_forgetting_quality.py --check
