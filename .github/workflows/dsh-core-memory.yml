name: DSH core memory

on:
  pull_request:
    paths:
      - 'integrations/dsh-core-memory/**'
      - 'tests/test_dsh_core_*.py'
      - 'scripts/build_dsh_core_memory_client.mjs'
      - 'scripts/verify_dsh_core_memory.ps1'
      - 'tests/support/dsh_core_memory_server.py'
      - '.github/workflows/dsh-core-memory.yml'
  push:
    branches: [master]
    paths:
      - 'integrations/dsh-core-memory/**'
      - 'tests/test_dsh_core_*.py'
      - 'scripts/build_dsh_core_memory_client.mjs'
      - 'scripts/verify_dsh_core_memory.ps1'
      - 'tests/support/dsh_core_memory_server.py'
      - '.github/workflows/dsh-core-memory.yml'

permissions:
  contents: read

jobs:
  node-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Core, lifecycle and package tests
        run: node --test "integrations/dsh-core-memory/test/*.test.mjs"

  lantai-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install project test dependencies
        run: pip install -e .[dev]
      - name: Full suite with real Lantai and Node contracts enabled
        env:
          API_KEY: test-key
          LANTAI_TEST_NODE: node
        run: pytest tests/ -q
